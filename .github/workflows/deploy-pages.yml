name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build for GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      # GitHub Pages serves this file for unknown paths. React Router then
      # reads the original URL and renders /services or the real not-found page.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      # GitHub Pages may return 404 for a clean nested route unless a matching
      # directory index exists. Keep the SPA fallback, and also publish a real
      # static entry point for direct visits to /services and /services/.
      - name: Add direct Services route entry point
        run: |
          mkdir -p dist/services
          cp dist/index.html dist/services/index.html

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
